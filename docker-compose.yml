services:
  reminder-agent:
    image: rajpatel923/reminder-agent:latest
    build: .
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.path.exists('/app/data')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  dashboard-backend:
    image: rajpatel923/reminder-agent-backend:latest
    build: ./dashboard/backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./src:/app/src
    extra_hosts:
      - "host.docker.internal:host-gateway"

  dashboard-frontend:
    image: rajpatel923/reminder-agent-frontend:latest
    build: ./dashboard/frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://localhost:8000
